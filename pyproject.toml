[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, because there is no src-layout and setuptools would otherwise try to
# auto-discover `tools` as a package too.
packages = ["myfind"]

[project]
name = "myfind"
version = "0.2.0"
description = "A small collection discovery portal: Starlette + Jinja over a BaseX XML store, with Solr as the search index"
requires-python = ">=3.11"
dependencies = [
    "starlette>=0.37",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]
# The ASGI server. Deliberately NOT from apt: the packaged one targets the system
# Python (3.12) and cannot see this venv (3.14) -- see deploy/README.md.
prod = ["uvicorn>=0.30"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a live BaseX and/or Solr are marked, so the pure-Python core
# can be run alone and quickly: `pytest -m "not integration"`. Marked tests skip
# themselves when the service is down, so a bare `pytest` is still runnable
# anywhere. NOTE: the marker is only honest while it is actually applied -- see
# tests/test_integration.py.
markers = [
    "integration: requires a running BaseX and/or Solr (skips itself when unavailable)",
]

[tool.coverage.run]
source = ["myfind"]
# The dev-server entry point is not worth importing in tests.
omit = ["myfind/__init__.py"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
