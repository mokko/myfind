[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit, because there is no src-layout and setuptools would otherwise try to
# auto-discover `tools` as a package too.
packages = ["myfind"]

[project]
name = "myfind"
version = "0.1.0"
description = "A small collection discovery portal: Flask + Jinja over a BaseX XML store, with Solr as the search index"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests that need a live BaseX are marked, so the pure-Python core can be run
# alone and quickly: `pytest -m "not integration"`. Marked tests skip
# themselves when BaseX is down, so a bare `pytest` is still runnable anywhere.
markers = [
    "integration: requires a running BaseX (skips itself when it is unavailable)",
]
