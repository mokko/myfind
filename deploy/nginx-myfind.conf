# myfind behind nginx.
#
# Install as /etc/nginx/sites-available/myfind and symlink into sites-enabled,
# or drop it in conf.d/. Adjust server_name and the listen line.
#
# Why a reverse proxy in front of gunicorn at all:
#   - TLS terminates in one place, and the app never handles a certificate
#   - nginx serves /static directly, so gunicorn workers are not spent on files
#   - slow clients are buffered by nginx rather than occupying a worker
#   - one place to add auth, rate limiting or IP restrictions

server {
    listen 80;
    # For a LAN-only proof of concept this is enough. Give it a real name (or a
    # tailnet name) once there is one; Let's Encrypt needs a public DNS name, and
    # for an internal-only service Caddy is less work than certbot.
    server_name _;

    # nginx runs as www-data. /home/maurice is mode 755, so it can traverse to
    # this directory -- verified, because the usual failure is a 403 from a
    # directory nginx cannot enter, which reads as a missing file.
    location /static/ {
        alias /home/maurice/py/myfind/static/;
        expires 1h;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8010;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # MUST exceed gunicorn's --timeout (120 s), or nginx cuts a request that
        # gunicorn would still have answered. The failure looks like a 504 for
        # the slowest, most legitimate queries -- a cold BaseX page.
        proxy_read_timeout 130s;
        proxy_connect_timeout 10s;

        # Let nginx buffer the response so a slow client does not hold a worker.
        proxy_buffering on;
    }
}
